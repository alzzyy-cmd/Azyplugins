name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Zip dosyasını bul ve aç
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Repo kökünde .zip dosyası bulunamadı!"
            exit 1
          fi
          echo "Bulunan zip: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .
          echo "Açılan içerik:"
          ls -la

      - name: JDK 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: AzySell derle
        if: hashFiles('AzySell/pom.xml') != ''
        working-directory: AzySell
        run: mvn -B clean package

      - name: AzyWorth derle
        if: hashFiles('AzyWorth/pom.xml') != ''
        working-directory: AzyWorth
        run: mvn -B clean package

      - name: Jar dosyalarını topla
        run: |
          mkdir -p build-output
          find . -path ./build-output -prune -o -path "*/target/*.jar" -print | grep -v original- | xargs -I{} cp {} build-output/
          echo "Toplanan jar'lar:"
          ls -la build-output

      - name: Jar'ları artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: azy-plugins-jars
          path: build-output/*.jar
          if-no-files-found: error
