name: Build Azy Plugins

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract plugin ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: Repository kökünde ZIP bulunamadı."
            exit 1
          fi
          echo "ZIP bulundu: $ZIP_FILE"
          rm -rf build-source
          mkdir -p build-source
          unzip -q "$ZIP_FILE" -d build-source
          echo "ZIP içeriği:"
          find build-source -maxdepth 3 -type f | sort

      - name: Verify reactor pom.xml
        shell: bash
        run: |
          set -e
          if [ ! -f "build-source/pom.xml" ]; then
            echo "HATA: ZIP kökünde reactor pom.xml bulunamadı."
            exit 1
          fi
          echo "Reactor pom.xml bulundu: build-source/pom.xml"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            build-source/**/pom.xml

      - name: Verify Java and Maven
        shell: bash
        run: |
          java -version
          mvn -version

      - name: Build all plugins (reactor)
        shell: bash
        working-directory: build-source
        run: |
          set -e
          mvn -B -U clean install

      - name: Verify JAR files
        shell: bash
        run: |
          set -e
          echo "Oluşturulan JAR dosyaları:"
          find build-source -type f -path "*/target/*.jar" -print
          COUNT="$(find build-source -type f -path "*/target/*.jar" | wc -l)"
          if [ "$COUNT" -eq 0 ]; then
            echo "HATA: Hiç JAR oluşturulmadı."
            exit 1
          fi
          echo "Toplam JAR: $COUNT"

      - name: Upload plugin JARs
        uses: actions/upload-artifact@v4
        with:
          name: AzyPlugins-Paper-1.21.4-Java-21
          path: |
            build-source/**/target/*.jar
          if-no-files-found: error
          retention-days: 30
