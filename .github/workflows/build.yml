name: Build Azy Plugins

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check Maven project
        run: test -f pom.xml

      - name: Check PacketEvents 2.12.1
        run: |
          mvn -B -U dependency:tree | grep -i "com.github.retrooper:packetevents-spigot:jar:2.12.1"

      - name: Build
        run: mvn -B -U clean package

      - name: Verify JARs
        run: |
          set -e
          find . -type f -path "*/target/*.jar" -print
          test -n "$(find . -type f -path "*/target/*.jar" -print -quit)"

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: AzyPlugins-JARs
          path: "**/target/*.jar"
          if-no-files-found: error
          retention-days: 30
