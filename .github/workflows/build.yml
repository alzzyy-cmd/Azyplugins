name: Build Azy Plugins

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP bulunamadı!"
            exit 1
          fi

          rm -rf .build
          mkdir .build
          unzip -q "$ZIP_FILE" -d .build

          echo "ZIP içeriği:"
          find .build -maxdepth 4 -type f | sort | head -100

      - name: Detect Maven project root
        shell: bash
        run: |
          set -e

          if [ -f ".build/source/AzySell/pom.xml" ]; then
            echo "PROJECT_ROOT=.build/source" >> "$GITHUB_ENV"

          elif [ -f ".build/AzySell/pom.xml" ]; then
            echo "PROJECT_ROOT=.build" >> "$GITHUB_ENV"

          else
            echo "AzySell pom.xml bulunamadı!"
            find .build -name pom.xml -print
            exit 1
          fi

      - name: Build AzySell
        run: |
          mvn -B -f "$PROJECT_ROOT/AzySell/pom.xml" clean package -DskipTests

      - name: Build AzyWorth
        run: |
          mvn -B -f "$PROJECT_ROOT/AzyWorth/pom.xml" clean package -DskipTests

      - name: Upload AzySell
        uses: actions/upload-artifact@v4
        with:
          name: AzySell
          path: .build/**/AzySell/target/*.jar
          if-no-files-found: error

      - name: Upload AzyWorth
        uses: actions/upload-artifact@v4
        with:
          name: AzyWorth
          path: .build/**/AzyWorth/target/*.jar
          if-no-files-found: error
