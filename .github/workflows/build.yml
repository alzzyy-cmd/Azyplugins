name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Extract plugin source
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP bulunamadı!"
            exit 1
          fi

          echo "Bulunan ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP içeriği:"
          find extracted -maxdepth 4 -type f | sort

      - name: Build AzySell
        run: |
          mvn -f extracted/source/AzySell/pom.xml clean package -DskipTests

      - name: Build AzyWorth
        run: |
          mvn -f extracted/source/AzyWorth/pom.xml clean package -DskipTests

      - name: Upload AzySell
        uses: actions/upload-artifact@v4
        with:
          name: AzySell
          path: extracted/source/AzySell/target/*.jar

      - name: Upload AzyWorth
        uses: actions/upload-artifact@v4
        with:
          name: AzyWorth
          path: extracted/source/AzyWorth/target/*.jar
