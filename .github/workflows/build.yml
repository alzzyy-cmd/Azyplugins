name: Maven Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build AzySell
        working-directory: source/AzySell
        run: mvn clean package -DskipTests

      - name: Build AzyWorth
        working-directory: source/AzyWorth
        run: mvn clean package -DskipTests

      - name: Upload AzySell JAR
        uses: actions/upload-artifact@v4
        with:
          name: AzySell
          path: source/AzySell/target/*.jar

      - name: Upload AzyWorth JAR
        uses: actions/upload-artifact@v4
        with:
          name: AzyWorth
          path: source/AzyWorth/target/*.jar
