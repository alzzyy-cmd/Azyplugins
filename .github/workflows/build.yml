name: Build Azy Plugins

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository'yi indir
      - name: Checkout
        uses: actions/checkout@v6

      # 2. ZIP dosyasını bul ve aç
      - name: Extract plugin ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: Repository kökünde ZIP bulunamadı."
            exit 1
          fi

          echo "ZIP bulundu: $ZIP_FILE"

          rm -rf build-source
          mkdir -p build-source

          unzip -q "$ZIP_FILE" -d build-source

          echo "ZIP içeriği:"
          find build-source -maxdepth 3 -type f | sort

      # 3. ZIP'in içindeki gerçek Maven root'unu bul
      - name: Find Maven project
        shell: bash
        run: |
          set -e

          POM="$(find build-source -type f -name 'pom.xml' -print -quit)"

          if [ -z "$POM" ]; then
            echo "HATA: ZIP içerisinde pom.xml bulunamadı."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$POM")"

          echo "Maven POM: $POM"
          echo "Maven project directory: $PROJECT_DIR"

          echo "POM_PATH=$POM" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 4. Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            build-source/**/pom.xml

      # 5. Java / Maven kontrolü
      - name: Verify Java and Maven
        shell: bash
        run: |
          java -version
          mvn -version

      # 6. Maven dependency'lerini çöz
      - name: Resolve Maven dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mvn -B -U dependency:resolve

      # 7. PacketEvents 2.12.1 kontrolü
      - name: Verify PacketEvents 2.12.1
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail

          mvn -B -U dependency:tree \
            -Dincludes=com.github.retrooper:packetevents-spigot \
            | tee packetevents-tree.txt

          grep -F "com.github.retrooper:packetevents-spigot:jar:2.12.1" \
            packetevents-tree.txt

      # 8. Gerçek Maven build
      - name: Build plugins
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mvn -B -U clean package

      # 9. Oluşan JAR'ları kontrol et
      - name: Verify JAR files
        shell: bash
        run: |
          set -e

          echo "Oluşturulan JAR dosyaları:"

          find "${PROJECT_DIR}" \
            -type f \
            -path "*/target/*.jar" \
            -print

          COUNT="$(find "${PROJECT_DIR}" \
            -type f \
            -path "*/target/*.jar" \
            | wc -l)"

          if [ "$COUNT" -eq 0 ]; then
            echo "HATA: Hiç JAR oluşturulmadı."
            exit 1
          fi

          echo "Toplam JAR: $COUNT"

      # 10. JAR'ları Artifact olarak yükle
      - name: Upload plugin JARs
        uses: actions/upload-artifact@v4
        with:
          name: AzyPlugins-Paper-1.21.4-Java-21
          path: |
            build-source/**/target/*.jar
          if-no-files-found: error
          retention-days: 30
