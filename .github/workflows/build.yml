name: Build AzyPlugins

# Bu workflow, repoya attığın AzyPlugins-updated.zip dosyasını KENDİSİ açar.
# Sen zipi hiç açmadan repoya (root'a) atman yeterli.
#
# Build sırası önemli çünkü AzySell -> AzyWorth'e derleme zamanı bağımlı:
#   1) AzyWorth  -> mvn install (jar'ı lokal Maven deposuna kurar)
#   2) AzyShop   -> mvn package (bağımsız)
#   3) AzySell   -> mvn package (install edilmiş AzyWorth'ü bulur)

on:
  push:
    branches: [ "main" ]
    paths:
      - "AzyPlugins-updated.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: JDK 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Zip'i aç
        run: |
          if [ ! -f "AzyPlugins-updated.zip" ]; then
            echo "AzyPlugins-updated.zip repo kök dizininde bulunamadı!"
            exit 1
          fi
          unzip -o AzyPlugins-updated.zip -d extracted

      - name: AzyWorth derle ve local repoya kur
        working-directory: extracted/AzyWorth
        run: mvn -B clean install

      - name: AzyShop derle
        working-directory: extracted/AzyShop
        run: mvn -B clean package

      - name: AzySell derle
        working-directory: extracted/AzySell
        run: mvn -B clean package

      - name: Jar'ları topla
        run: |
          mkdir -p build-output
          find extracted -type f -name "*.jar" \
            -path "*/target/*" \
            ! -name "original-*.jar" \
            -exec cp {} build-output/ \;
          ls -la build-output

      - name: Jar'ları artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: AzyPlugins-jars
          path: build-output/*.jar
          if-no-files-found: error
